<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover はスマホのノッチ領域対応（Capacitor 化を見据えて） -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#101018">
  <title>ClaudeGame005</title>
  <!-- 更新時は ?v= の数字を上げる。ブラウザに古い CSS/JS が残って画面が切り替わらなくなるのを防ぐ -->
  <!-- GitHub Pages のサブパス配信と Capacitor の両方で壊れないよう、リソースは必ず相対パスで指定する -->
  <link rel="stylesheet" href="css/style.css?v=6">
</head>
<body>
  <main id="app">
    <canvas id="game" aria-label="ゲーム画面"></canvas>
    <div id="overlay">
      <h1>ClaudeGame005</h1>
      <p>Pickle♡Mellow リズム</p>
      <button id="start" type="button">タップしてスタート</button>
    </div>
  </main>
  <script type="module" src="js/main.js?v=6"></script>
</body>
</html>
