<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover はスマホのノッチ領域対応（Capacitor 化を見据えて） -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#101018">
  <title>ClaudeGame005</title>
  <!-- GitHub Pages のサブパス配信と Capacitor の両方で壊れないよう、リソースは必ず相対パスで指定する -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="app">
    <canvas id="game" aria-label="ゲーム画面"></canvas>
    <div id="overlay">
      <h1>ClaudeGame005</h1>
      <p>リズムゲーム（開発準備中）</p>
      <button id="start" type="button">タップしてスタート</button>
    </div>
    <div id="hud" hidden>
      <p>プレイ画面（準備中）</p>
      <p class="hint">画面をタップすると反応します</p>
      <button id="back" type="button">タイトルへ戻る</button>
    </div>
  </main>
  <script type="module" src="js/main.js"></script>
</body>
</html>
