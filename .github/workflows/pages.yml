# push ごとにチェックを実行し、必要に応じて www/ を GitHub Pages に公開するワークフロー。
# デプロイジョブは、Settings > Pages の Source を「GitHub Actions」にし、
# リポジトリ変数 PAGES_VIA_ACTIONS を true にした場合だけ実行される。
# 「Deploy from a branch」で公開している間はチェックだけが実行される。
name: Check and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    needs: check
    if: vars.PAGES_VIA_ACTIONS == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4
